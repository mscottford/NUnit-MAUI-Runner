name: CI

# Pull requests and branch pushes are built and tested but never published. Releasing happens
# only when something lands on the default branch; see release.yml.
on:
  pull_request:
  push:
    branches-ignore: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-26 is pinned rather than macos-latest for two reasons: it is the image that carries
    # an iOS 26.x SDK, which net10.0-ios26.0 needs, and it has the Android emulator
    # preinstalled, so both platforms can be tested from one job.
    runs-on: macos-26

    env:
      # Named once: it is both the cache key and what sdkmanager installs.
      ANDROID_SYSTEM_IMAGE: system-images;android-36;google_apis;arm64-v8a
      # Where the preinstalled SDK lives on this image, per the runner image manifest.
      ANDROID_SDK_DIR: /Users/runner/Library/Android/sdk

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The build script derives the version from the commit count and nearest tag.
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The system image is over a gigabyte and none of the runner images ship one, so it is
      # worth caching. The key is the image spec, so it only re-downloads when that changes.
      - name: Cache the Android system image
        id: system-image-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.ANDROID_SDK_DIR }}/system-images
          key: android-system-image-${{ env.ANDROID_SYSTEM_IMAGE }}

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-ios

      - name: Install tools
        run: dotnet tool restore

      # The runner images ship the Android SDK but no system image, so the emulator has nothing
      # to boot until one is installed. The build script then picks the newest installed image
      # matching the host architecture.
      - name: Install an Android system image
        if: steps.system-image-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_SYSTEM_IMAGE"

      - name: Test
        run: dotnet cake --target Test --configuration release

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            Artifacts/*.xml
            Artifacts/xharness-*/**
          if-no-files-found: warn

  pack:
    # Proves the package still builds, and leaves it downloadable for checking a change before
    # it is released.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-ios

      - name: Install tools
        run: dotnet tool restore

      - name: Build and pack
        run: |
          dotnet cake --configuration release
          dotnet cake --target Pack --configuration release

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nupkg
          path: Artifacts/*.nupkg
          if-no-files-found: error
