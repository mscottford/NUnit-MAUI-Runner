name: Test

# Called by ci.yml for pull requests and by release.yml before it publishes anything, so the
# same tests gate both. Keeping it in one place means a release cannot quietly run a different,
# weaker set of checks than a pull request does.
on:
  workflow_call:

jobs:
  test:
    # macos-26 is pinned rather than macos-latest for two reasons: it is the image that carries
    # an iOS 26.x SDK, which net10.0-ios26.0 needs, and it has the Android emulator
    # preinstalled, so both platforms can be tested from one job.
    runs-on: macos-26

    env:
      # Named once: it is both the cache key and what sdkmanager installs.
      ANDROID_SYSTEM_IMAGE: system-images;android-36;google_apis;arm64-v8a
      # Where the preinstalled SDK lives on this image, per the runner image manifest.
      ANDROID_SDK_DIR: /Users/runner/Library/Android/sdk

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build script derives the version from the commit count and nearest tag.
          fetch-depth: 0

      # Left as a single cache step, unlike the system image below: this one is populated by the
      # pack job, which does not run tests and so reliably succeeds and saves. The packages are
      # also cheap enough to refetch that it is not worth the extra steps.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The system image is over a gigabyte and none of the runner images ship one, so it is
      # worth caching. Restore and save are separate steps rather than one cache step: the
      # combined form only saves when the job succeeds, so a failing test run threw the download
      # away and the next run fetched it again. Saving happens right after the install below,
      # before anything that can fail.
      - name: Restore the Android system image
        id: system-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANDROID_SDK_DIR }}/system-images
          key: android-system-image-${{ env.ANDROID_SYSTEM_IMAGE }}

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-ios

      - name: Install tools
        run: dotnet tool restore

      # The runner images ship the Android SDK but no system image, so the emulator has nothing
      # to boot until one is installed. The build script then picks the newest installed image
      # matching the host architecture.
      - name: Install an Android system image
        if: steps.system-image-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_SYSTEM_IMAGE"

      # Saved before the tests run, so the download survives a test failure.
      - name: Save the Android system image
        if: steps.system-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANDROID_SDK_DIR }}/system-images
          key: android-system-image-${{ env.ANDROID_SYSTEM_IMAGE }}

      # --keep-simulator and --keep-emulator skip the erase, cold boot and shutdown that a
      # development machine wants. The runner is discarded when the job ends, so none of that
      # buys anything here, and the erase alone was enough to push the iOS run over its timeout.
      - name: Test
        run: |
          dotnet cake --target Test --configuration release \
            --keep-simulator --keep-emulator

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            Artifacts/*.xml
            Artifacts/xharness-*/**
          if-no-files-found: warn
