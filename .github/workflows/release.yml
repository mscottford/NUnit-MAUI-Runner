name: Release

# Anything landing on the default branch is a release. Versionize reads the conventional commit
# messages since the last tag, decides whether that is a patch, minor or major bump, writes the
# changelog and tags it; the tag is then what the build takes its version from.
#
# The tests run first, on the merge result, and nothing is versioned, tagged or published unless
# they pass. A pull request having been green is not enough on its own: the branch it was tested
# against may have moved since.
#
# When nothing since the last release is significant -- only docs, chores or refactors --
# versionize exits non-zero and the remaining steps are skipped, so a merge does not have to
# produce a release.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same tests a pull request runs, against what actually landed.
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    # See ci.yml: this image is the one with an iOS 26.x SDK, which net10.0-ios26.0 needs.
    runs-on: macos-26
    if: github.repository == 'mscottford/NUnit-MAUI-Runner'

    permissions:
      # Pushing the release commit, the tag, and creating the GitHub release.
      contents: write
      # Trusted publishing: lets the job ask GitHub for the OIDC token that nuget.org
      # exchanges for a short-lived API key.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Versionize needs the full history and tags to work out the bump.
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-ios

      - name: Install tools
        run: dotnet tool restore

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # [skip ci] on the release commit is belt and braces: a push made with GITHUB_TOKEN does
      # not trigger workflows anyway.
      - name: Version
        id: versionize
        continue-on-error: true
        run: |
          dotnet versionize \
            --tag-template 'v{version}' \
            --exit-insignificant-commits \
            --commit-suffix '[skip ci]'

      # Versionize failing is not necessarily a problem: it also fails when nothing since the
      # last release was significant. Two cases are worth releasing, and they differ only in
      # whether the tag still has to be pushed:
      #
      #   it cut a new version   -> tag exists locally, push it
      #   HEAD is already tagged -> a previous run tagged and pushed but did not finish
      #                             publishing, so pick that tag up and carry on
      #
      # Anything else means there is genuinely nothing to do. Publishing is idempotent, so
      # re-running a release that already completed is harmless.
      - name: Work out what to release
        id: release
        run: |
          if [ "${{ steps.versionize.outcome }}" = "success" ]; then
            tag=$(git describe --tags --exact-match HEAD)
            echo "Versionize cut $tag."
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif tag=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            echo "Nothing new to version, but HEAD is $tag; finishing that release."
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "No feat, fix or breaking commits since the last release, and HEAD is not"
            echo "tagged. Nothing to publish."
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      # Built before anything is pushed: a build or pack failure leaves the branch untouched
      # and the run can simply be retried. The tag exists locally by this point, which is where
      # the version comes from.
      - name: Build and pack
        if: steps.release.outputs.tag != ''
        run: |
          dotnet cake --configuration release
          dotnet cake --target Pack --configuration release

      - name: Check the package carries the release version
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          expected="Artifacts/MScottFord.Forks.NUnit.Maui.Runner.${TAG#v}.nupkg"
          if [ ! -f "$expected" ]; then
            echo "Expected $expected but found:" >&2
            ls -1 Artifacts/*.nupkg >&2
            exit 1
          fi
          echo "Packaged $expected"

      - name: Push the release commit and tag
        if: steps.release.outputs.push == 'true'
        run: git push --follow-tags origin HEAD:${{ github.ref_name }}

      # Exchanges the job's OIDC token for an API key that is valid for an hour, so it is
      # requested immediately before the push rather than earlier in the job. There is no
      # long-lived key to store: nuget.org matches the token against the trusted publishing
      # policy registered for this repository and this workflow file.
      - name: Log in to NuGet
        if: steps.release.outputs.tag != ''
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: mscottford

      - name: Publish to NuGet
        if: steps.release.outputs.tag != ''
        run: |
          dotnet cake --target Nuget --configuration release \
            --nuget-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"

      # Skipped when the release already exists, which is the case when an earlier run got this
      # far and then failed.
      - name: Create the GitHub release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes Artifacts/*.nupkg
          fi
