name: Publish

# A push to the default branch publishes a preview (2.0.<commits>-preview); pushing a tag
# publishes the release that tag names. Both come out of the same build, so nothing about a
# release is built differently from the previews that preceded it.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    # The package carries both android and ios assemblies, and the ios half needs Xcode, so
    # this cannot run on a Linux runner.
    runs-on: macos-latest

    # Without this, a fork of this fork would publish over the same package id.
    if: github.repository == 'mscottford/NUnit-MAUI-Runner'

    steps:
      - uses: actions/checkout@v4
        with:
          # The build script works the version out from the commit count and the nearest tag,
          # and the default shallow clone has neither.
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-ios

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet cake --configuration release

      - name: Pack
        run: dotnet cake --target Pack --configuration release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: Artifacts/*.nupkg
          if-no-files-found: error

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY is not configured; skipping the push." >&2
            exit 1
          fi
          dotnet cake --target Nuget --configuration release --nuget-key "$NUGET_API_KEY"
